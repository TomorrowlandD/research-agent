<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResearchAgent · 工作会话</title>
<link rel="stylesheet" href="/style.css"><script src="/trace.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<header><strong>ResearchAgent</strong><span>本地工作区</span></header>
<main>
<section class="session"><div class="heading"><h1>工作会话</h1><span id="status" role="status">正在连接</span></div>
<div id="history" aria-label="会话记录"><p id="empty">输入任务开始会话。需要授权的工具会在这里请求审批。</p></div></section>
<form id="composer"><label for="prompt">任务输入</label><textarea id="prompt" rows="3" required placeholder="描述你希望完成的任务"></textarea>
<div class="actions"><span>Ctrl / ⌘ + Enter 发送</span><button id="send" disabled>发送任务</button></div></form>
</main>
</body></html>
